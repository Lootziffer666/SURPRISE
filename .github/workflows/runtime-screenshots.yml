name: Runtime screenshots

on:
  push:
    branches:
      - 'kilo/elegant-laser-keo'
    paths:
      - '.github/workflows/runtime-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          npm run build
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/preview.log
          exit 1

      - name: Browser test and screenshots
        run: |
          set -euo pipefail
          mkdir -p docs/screenshots
          cat > screenshot-test.mjs <<'JS'
          import { chromium } from './node_modules/playwright/index.mjs';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-unsafe-swiftshader']});
          const page = await browser.newPage({viewport:{width:1365,height:768}});
          const errors=[]; const warnings=[];
          page.on('console', m => { if(m.type()==='error') errors.push(m.text()); if(m.type()==='warning') warnings.push(m.text()); });
          page.on('pageerror', e => errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
          await page.waitForTimeout(1600);
          const canvas = page.locator('canvas').first();
          if (await page.locator('canvas').count() < 1) throw new Error('No canvas rendered');
          const info = await page.evaluate(() => {
            const c=document.querySelector('canvas');
            const gl=c?.getContext('webgl2')||c?.getContext('webgl');
            return {title:document.title,canvasCount:document.querySelectorAll('canvas').length,width:c?.width,height:c?.height,webgl:!!gl};
          });
          if(!info.webgl) throw new Error('Canvas rendered without WebGL context');
          await page.screenshot({path:'docs/screenshots/01-start.png',fullPage:true});
          await page.keyboard.down('KeyW'); await page.waitForTimeout(700); await page.keyboard.up('KeyW'); await page.waitForTimeout(350);
          await page.screenshot({path:'docs/screenshots/02-after-keyboard-input.png',fullPage:true});
          const box=await canvas.boundingBox(); if(!box) throw new Error('Canvas has no bounding box');
          await page.mouse.click(box.x+box.width*0.72,box.y+box.height*0.58); await page.waitForTimeout(950);
          await page.screenshot({path:'docs/screenshots/03-after-click.png',fullPage:true});
          const report={testedAt:new Date().toISOString(),url:'http://127.0.0.1:4173/',...info,interactions:['W key','click'],consoleErrors:errors,consoleWarnings:warnings,status:errors.length?'rendered-with-console-errors':'rendered-without-runtime-errors'};
          fs.writeFileSync('docs/screenshots/test-report.json',JSON.stringify(report,null,2));
          await browser.close();
          if(errors.length){console.error(errors.join('\n'));process.exit(1);}
          JS
          node screenshot-test.mjs
          rm screenshot-test.mjs

      - name: Commit screenshots
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots
          git diff --cached --quiet && { echo 'No screenshot changes'; exit 0; }
          git commit -m 'Add verified runtime screenshots'
          git push
